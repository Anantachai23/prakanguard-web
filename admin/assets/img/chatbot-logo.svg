<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="60%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </radialGradient>

    <!-- Gemini Outer Ring Gradient -->
    <linearGradient id="geminiRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4285F4" />
      <stop offset="35%" stopColor="#9B72CF" />
      <stop offset="70%" stopColor="#D946EF" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>

    <!-- Water Droplet Body Gradient -->
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stopColor="#7dd3fc" />
      <stop offset="25%" stopColor="#38bdf8" />
      <stop offset="65%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#1d4ed8" />
    </linearGradient>

    <!-- Inner Glow for Droplet -->
    <radialGradient id="dropGlow" cx="40%" cy="30%" r="50%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.85" />
      <stop offset="40%" stopColor="#bae6fd" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#0284c7" stopOpacity="0" />
    </radialGradient>

    <!-- Sprout Leaves Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#15803d" />
      <stop offset="60%" stopColor="#22c55e" />
      <stop offset="100%" stopColor="#86efac" />
    </linearGradient>

    <!-- Headset Gradient -->
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f8fafc" />
      <stop offset="50%" stopColor="#cbd5e1" />
      <stop offset="100%" stopColor="#64748b" />
    </linearGradient>

    <!-- Gemini Sparkle Star Gradient -->
    <linearGradient id="starGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="50%" stopColor="#c084fc" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>

    <!-- Water Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284c7" stopOpacity="0.6" />
      <stop offset="50%" stopColor="#38bdf8" stopOpacity="0.9" />
      <stop offset="100%" stopColor="#0ea5e9" stopOpacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248" />
    </clipPath>
  </defs>

  <!-- Circular Outer Container -->
  <g clip-path="url(#circleClip)">
    <!-- Dark Tech Backdrop -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)" />

    <!-- Ambient Glow behind character -->
    <circle cx="256" cy="260" r="170" fill="#0284c7" opacity="0.25" filter="url(#softGlow)" />
    <circle cx="256" cy="240" r="120" fill="#9333ea" opacity="0.18" filter="url(#softGlow)" />

    <!-- Sonar Concentric Rings -->
    <circle cx="256" cy="270" r="185" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3" />
    <circle cx="256" cy="270" r="215" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.2" />

    <!-- Waves at bottom -->
    <path d="M 0 420 Q 128 395 256 420 T 512 420 L 512 512 L 0 512 Z" fill="url(#waveGrad)" />
    <path d="M 0 445 Q 140 430 256 450 T 512 445 L 512 512 L 0 512 Z" fill="#0369a1" opacity="0.7" />

    <!-- Sprout Leaves on top of Droplet Head -->
    <!-- Left Leaf -->
    <path d="M 256 128 C 220 120 205 90 220 72 C 242 80 252 104 256 128 Z" fill="url(#leafGrad)" />
    <path d="M 256 128 C 238 106 226 88 223 75" fill="none" stroke="#bbf7d0" stroke-width="2" stroke-linecap="round" />
    <!-- Right Leaf -->
    <path d="M 256 128 C 285 110 305 82 290 66 C 270 76 260 102 256 128 Z" fill="url(#leafGrad)" />
    <path d="M 256 128 C 270 102 282 82 288 68" fill="none" stroke="#bbf7d0" stroke-width="2" stroke-linecap="round" />

    <!-- Main Water Droplet Body -->
    <path d="M 256 122 C 200 195 136 265 136 330 C 136 396 190 442 256 442 C 322 442 376 396 376 330 C 376 265 312 195 256 122 Z" fill="url(#dropGrad)" />

    <!-- Droplet Highlights & Specular Reflections -->
    <path d="M 256 130 C 215 195 152 260 152 325 C 152 355 168 390 195 410 C 175 385 165 350 165 320 C 165 265 220 200 256 145 Z" fill="url(#dropGlow)" />
    <ellipse cx="205" cy="275" rx="28" ry="50" transform="rotate(-26 205 275)" fill="#ffffff" opacity="0.55" />
    <ellipse cx="220" cy="235" rx="10" ry="16" transform="rotate(-26 220 235)" fill="#ffffff" opacity="0.75" />

    <!-- Futuristic Headset / Communicator Arc -->
    <path d="M 148 310 C 144 210 368 210 364 310" fill="none" stroke="url(#headsetGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
    <path d="M 160 290 C 160 225 352 225 352 290" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6" />

    <!-- Left Headset Earpiece -->
    <rect x="130" y="295" width="26" height="50" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <circle cx="143" cy="320" r="5" fill="#38bdf8" />
    <!-- Right Headset Earpiece -->
    <rect x="356" y="295" width="26" height="50" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="4" />
    <circle cx="369" cy="320" r="5" fill="#c084fc" />

    <!-- Communicator Mic Boom -->
    <path d="M 364 335 Q 350 375 305 380" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
    <circle cx="298" cy="380" r="8" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="298" cy="380" r="4" fill="#ffffff" />

    <!-- Cute Smiling Eyes -->
    <!-- Left Eye -->
    <ellipse cx="218" cy="305" rx="18" ry="24" fill="#0f172a" />
    <ellipse cx="223" cy="298" rx="7" ry="10" fill="#ffffff" />
    <circle cx="212" cy="315" r="4" fill="#38bdf8" opacity="0.8" />
    <!-- Right Eye -->
    <ellipse cx="294" cy="305" rx="18" ry="24" fill="#0f172a" />
    <ellipse cx="299" cy="298" rx="7" ry="10" fill="#ffffff" />
    <circle cx="288" cy="315" r="4" fill="#38bdf8" opacity="0.8" />

    <!-- Kawaii Cheeks -->
    <ellipse cx="185" cy="335" rx="15" ry="9" fill="#f43f5e" opacity="0.5" filter="url(#softGlow)" />
    <ellipse cx="327" cy="335" rx="15" ry="9" fill="#f43f5e" opacity="0.5" filter="url(#softGlow)" />

    <!-- Cute Happy Mouth / Smile -->
    <path d="M 238 338 Q 256 360 274 338" fill="none" stroke="#0f172a" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 246 345 Q 256 358 266 345" fill="#f43f5e" opacity="0.85" />

    <!-- Floating Gemini AI Sparkle Stars (✦) -->
    <!-- Large Star Top-Right -->
    <g transform="translate(385, 95)" filter="url(#softGlow)">
      <path d="M 26 0 C 26 14.36 14.36 26 0 26 C 14.36 26 26 37.64 26 52 C 26 37.64 37.64 26 52 26 C 37.64 26 26 14.36 26 0 Z" fill="url(#starGrad1)" />
      <circle cx="26" cy="26" r="4" fill="#ffffff" />
    </g>

    <!-- Small Star Top-Left -->
    <g transform="translate(75, 140)">
      <path d="M 16 0 C 16 8.84 8.84 16 0 16 C 8.84 16 16 23.16 16 32 C 16 23.16 23.16 16 32 16 C 23.16 16 16 8.84 16 0 Z" fill="url(#geminiRing)" opacity="0.9" />
      <circle cx="16" cy="16" r="2.5" fill="#ffffff" />
    </g>

    <!-- Tiny Star Lower-Right -->
    <g transform="translate(415, 380)">
      <path d="M 12 0 C 12 6.63 6.63 12 0 12 C 6.63 12 12 17.37 12 24 C 12 17.37 17.37 12 24 12 C 17.37 12 12 6.63 12 0 Z" fill="#38bdf8" opacity="0.85" />
    </g>

    <!-- Bottom Shield / AI Water Ribbon Badge -->
    <g transform="translate(180, 430)">
      <rect x="0" y="0" width="152" height="34" rx="17" fill="#0f172a" stroke="url(#geminiRing)" stroke-width="2.5" />
      <text x="76" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">PrakanBOT</text>
    </g>
  </g>

  <!-- Glowing Gemini Border Ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#geminiRing)" stroke-width="12" filter="url(#ringGlow)" opacity="0.75" />
  <circle cx="256" cy="256" r="248" fill="none" stroke="url(#geminiRing)" stroke-width="8" />
  <circle cx="256" cy="256" r="243" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
</svg>