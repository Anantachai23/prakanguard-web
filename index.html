<!doctype html>
<html lang="th" class="h-full w-full overflow-hidden select-none overscroll-none">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Aggressive Anti-Caching Meta Tags for Mobile / Instant Deployments -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PrakanGuard | ระบบข้อมูลเฝ้าระวังน้ำท่วม จ.สมุทรปราการ</title>
    <meta name="description" content="ศูนย์ข้อมูลและระบบสารสนเทศภูมิศาสตร์ (GIS) เฝ้าระวังอุทกภัยและน้ำท่วมผิวจราจร 6 อำเภอ จังหวัดสมุทรปราการ บูรณาการ ปภ. กรมทางหลวง การทางพิเศษ และกรมชลประทาน" />
    
    <!-- Google Fonts: Official Civic Typography (IBM Plex Sans Thai, Sarabun, Prompt, Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
      html, body, #root {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
      }
    </style>
  </head>
  <body class="h-full w-full fixed inset-0 overflow-hidden select-none overscroll-none bg-slate-900 text-slate-100 font-prompt antialiased selection:bg-blue-600 selection:text-white">
    <div id="root" class="h-full w-full fixed inset-0 overflow-hidden">
      <!-- Official Command Center Initial Loading Screen -->
      <div id="prakanguard-splash-loader" style="position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 38%, #0f1f38 0%, #080f1e 55%, #030712 100%); color: #f8fafc; font-family: 'IBM Plex Sans Thai', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif; padding: 24px; text-align: center; box-sizing: border-box;">
        
        <!-- Official Crest Emblem with Gold/Navy Border Ring -->
        <div style="position: relative; width: 88px; height: 88px; margin-bottom: 20px;">
          <div style="position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid rgba(217, 119, 6, 0.4); animation: pg-pulse-ring 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
          <div style="position: absolute; inset: -2px; border-radius: 50%; background: rgba(30, 64, 175, 0.3);"></div>
          <img src="/logo.png" alt="ตราสัญลักษณ์จังหวัดสมุทรปราการ" style="position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; box-shadow: 0 12px 30px -4px rgba(15, 23, 42, 0.8); border: 2.5px solid rgba(255, 255, 255, 0.85);" />
        </div>

        <!-- Official Accreditation Badge -->
        <div style="display: inline-flex; align-items: center; gap: 8px; padding: 5px 16px; background: rgba(30, 58, 138, 0.35); border: 1px solid rgba(59, 130, 246, 0.4); border-radius: 9999px; font-size: 12px; font-weight: 600; color: #93c5fd; margin-bottom: 14px; letter-spacing: 0.03em;">
          <span style="width: 7px; height: 7px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; animation: pg-glow 1.5s infinite alternate;"></span>
          PrakanGuard • จ.สมุทรปราการ
        </div>

        <!-- Main Official Heading -->
        <h1 style="font-size: 20px; font-weight: 700; margin: 0 0 6px 0; color: #ffffff; letter-spacing: -0.01em;">
          ระบบสารสนเทศภูมิศาสตร์ (GIS) เฝ้าระวังน้ำท่วม
        </h1>

        <!-- Explanatory Subtext for Users -->
        <p style="font-size: 13px; color: #94a3b8; max-width: 440px; line-height: 1.6; margin: 0 0 20px 0; font-weight: 400;">
          เชื่อมโยงข้อมูลโทรมาตรระดับน้ำ เรดาร์ตรวจสภาพอากาศ และจุดเฝ้าระวัง 6 อำเภอ
        </p>

        <!-- Shimmering Progress Bar -->
        <div style="width: 220px; height: 4px; background: rgba(255, 255, 255, 0.12); border-radius: 9999px; overflow: hidden; margin-bottom: 14px;">
          <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #1d4ed8, #60a5fa, #1d4ed8); background-size: 200% 100%; animation: pg-shimmer 1.8s infinite linear;"></div>
        </div>

        <span style="font-size: 11.5px; color: #64748b; letter-spacing: 0.02em;">
          บูรณาการ ปภ. • กรมทางหลวง • กรมชลประทาน • ทร.
        </span>

        <style>
          @keyframes pg-pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.8; }
          }
          @keyframes pg-glow {
            from { opacity: 0.4; }
            to { opacity: 1; }
          }
          @keyframes pg-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
          }
        </style>
      </div>
    </div>

    <!-- Automatic Chunk Reload Handler for Vercel Deployments -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (
          e.message.indexOf('Failed to fetch dynamically imported module') > -1 ||
          e.message.indexOf('Loading chunk') > -1 ||
          e.message.indexOf('dynamically imported') > -1
        )) {
          console.warn('New deployment detected, reloading to fetch latest assets...');
          setTimeout(function() { window.location.reload(); }, 1500);
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Automated Official Flood Sync Engine with Change Detection (Traffy Fondue & Open-Meteo) -->
    <script src="/official-sync-engine.js" defer></script>
  </body>
</html>
